user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 4096;

    # Cấu hình Gzip tối ưu hóa hiệu năng truyền tải dữ liệu
    gzip on;
    gzip_disable "msie6";
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # ----------------------------------------------------
    # 1. Cấu hình HTTP cho API (api_vision.bosky.vn)
    # ----------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name api_vision.bosky.vn;

        # Log dành riêng cho subdomain API
        access_log /var/log/nginx/api_vision.bosky.vn.access.log main;
        error_log /var/log/nginx/api_vision.bosky.vn.error.log;

        location / {
            # Điền trực tiếp IP để tránh lỗi resolver phân giải DNS của Nginx
            proxy_pass http://157.66.100.182:5100;

            # Thiết lập Header để backend nhận biết được IP thật của Client
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeout mặc định cho API
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }

    # ----------------------------------------------------
    # 2. Cấu hình HTTP cho AI (ai_vision.bosky.vn)
    # ----------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name ai_vision.bosky.vn;

        # Log dành riêng cho subdomain AI
        access_log /var/log/nginx/ai_vision.bosky.vn.access.log main;
        error_log /var/log/nginx/ai_vision.bosky.vn.error.log;

        location / {
            proxy_pass http://42.96.5.149:3000;

            # Thiết lập Header cho Proxy
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Tăng dung lượng file upload (Cần thiết khi gửi ảnh/video/file lên để AI xử lý)
            client_max_body_size 100M;

            # Tăng timeout vì các tác vụ AI thường xử lý lâu hơn thông thường
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            # Hỗ trợ WebSockets (Cho các tính năng Streaming, Chatbot thời gian thực)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # ----------------------------------------------------
    # 3. Cấu hình HTTP cho Storage (Chuyển hướng sang HTTPS + Phục vụ Certbot gia hạn)
    # ----------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name storage.vifence.io;

        # Thư mục để Let's Encrypt truy cập file xác thực tự động sau này khi gia hạn (renew)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Tự động chuyển hướng tất cả các truy cập HTTP thông thường sang HTTPS bảo mật
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ----------------------------------------------------
    # 4. Cấu hình HTTPS bảo mật cho Storage -> MinIO API (Ảnh/Video)
    # ----------------------------------------------------
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name storage.vifence.io;

        # Đường dẫn tới chứng chỉ SSL vừa xin được từ Certbot
        ssl_certificate /etc/letsencrypt/live/storage.vifence.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/storage.vifence.io/privkey.pem;

        # Cấu hình bảo mật SSL tối ưu khuyên dùng
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Log danh riêng cho subdomain Storage
        access_log /var/log/nginx/storage.vifence.io.access.log main;
        error_log /var/log/nginx/storage.vifence.io.error.log;

        # Không strip header có gạch dưới (x-amz-*) - bắt buộc với AWS SigV4,
        # nếu không MinIO sẽ thỉnh thoảng trả lỗi 403 SignatureDoesNotMatch
        # (directive này chỉ hợp lệ ở cấp server/http, không được đặt trong location)
        ignore_invalid_headers off;

        location / {
            # Chuyển sang port 9000 (API lưu trữ ảnh/video). Giữ nguyên IP của bạn.
            proxy_pass http://157.66.100.182:9000;

            # Cập nhật bộ Header chống lỗi 403 ký tên AWS chuẩn S3
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Ép cứng https để MinIO biết request gốc là bảo mật, giúp tính toán chữ ký chính xác
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $http_host;

            # Không giới hạn dung lượng upload, để MinIO tự quản lý
            client_max_body_size 0;

            # Cấu hình tối ưu cho MinIO để truyền tải/upload file dung lượng lớn & xem video không giật lag
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 600s;
            proxy_connect_timeout 60s;

            # MinIO tự xử lý chunked transfer encoding cho upload/download,
            # để Nginx cũng chunk cùng lúc có thể gây lỗi với multipart upload
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            chunked_transfer_encoding off;
        }
    }
}